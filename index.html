<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Tech IPTV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div class="player-container">
        <video id="video-player" controls autoplay playsinline></video>
        <div class="now-playing" id="now-playing">T-Tech IPTV - Select a Channel</div>
    </div>

    <main class="main-content">
        
        <section id="screen-streams" class="screen active">
            <div class="search-box-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search over 6,000+ live streams...">
            </div>

            <div class="category-bar">
                <button class="category-pill active" data-category="all">All</button>
                <button class="category-pill" data-category="sports">⚽ Sports</button>
                <button class="category-pill" data-category="movies">🎬 Movies</button>
                <button class="category-pill" data-category="news">📰 News</button>
                <button class="category-pill" data-category="music">🎶 Music</button>
            </div>

            <div id="skeleton-loader" class="skeleton-container">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <div id="channel-grid" class="channel-grid"></div>
        </section>

        <section id="screen-favorites" class="screen">
            <h2 class="screen-title">Your Favorite Channels</h2>
            <div id="favorites-grid" class="channel-grid"></div>
        </section>

        <section id="screen-profile" class="screen">
            <div class="profile-card">
                <div class="profile-avatar-wrapper">
                    <a href="https://ibb.co.com/sd2LqKYz" target="_blank">
                        <img src="https://i.ibb.co.com/0RcPrCbv/IMG-20260608-012226.jpg" alt="Torikul Islam" class="profile-img">
                    </a>
                </div>
                <h1 class="profile-name">Torikul Islam</h1>
                <p class="profile-tagline">Founder & Lead Developer of T-Tech</p>
                <p class="profile-bio">"Hello! I'm Torikul Islam. A dedicated student with an expert-level proficiency in technology and creating complex digital solutions."</p>
                
                <div class="social-links">
                    <a href="https://www.facebook.com/share/18tpEvXJw7/" target="_blank" class="social-btn fb"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/torikul____islam?igsh=bno3d2wxODNyc2Mx" target="_blank" class="social-btn insta"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="screen-streams">
            <i class="fas fa-tv"></i>
            <span>Streams</span>
        </button>
        <button class="nav-item" data-target="screen-favorites">
            <i class="fas fa-heart"></i>
            <span>Favorites</span>
        </button>
        <button class="nav-item" data-target="screen-profile">
            <i class="fas fa-user-astronaut"></i>
            <span>Profile</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
